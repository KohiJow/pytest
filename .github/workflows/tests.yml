name: testes

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: prepara o python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: instala o ruff
        run: pip install ruff

      - name: lint e formatacao
        run: |
          ruff check .
          ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: prepara o python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: roda a suite
        run: pytest -v

      - name: cobertura de 8.Plugins tem que continuar em 100%
        run: pytest 8.Plugins --cov=8.Plugins --cov-report=term-missing --cov-fail-under=100
